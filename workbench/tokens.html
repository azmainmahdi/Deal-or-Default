<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 3: Tokens</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
/* Step 3 options: cast-metal player tokens, Monopoly style, one per country. */
html,body{margin:0}
body{background:#1a0f08 url(wood.jpg) center/cover fixed;min-height:100vh;padding:20px 16px 40px;box-sizing:border-box;color:#efe6d2;font:15px/1.45 system-ui}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0000 40%,#0008 100%);pointer-events:none}
.top{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.top button{font:600 14px system-ui;padding:9px 14px;border-radius:999px;border:1px solid #c9a24a66;background:#0d1426cc;color:#efe6d2;cursor:pointer}
.top button[aria-pressed=true]{background:#c9a24a;color:#1a1206;border-color:#c9a24a}
section{position:relative;max-width:1000px;margin:0 auto 26px;background:#0b1020b8;border:1px solid #c9a24a40;border-radius:14px;padding:14px 16px 6px}
h2{font:700 20px Fraunces,Georgia,serif;margin:0 0 2px;color:#f5d67b}
p{margin:0 0 6px;max-width:70ch;color:#d9d2c2}
#out{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1000px;margin:0 auto}#out section{margin:0}#out section:first-child{grid-column:1/-1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}figure{position:relative;display:flex;flex-direction:column;align-items:center}.mini{display:flex;align-items:center;gap:6px;font:11px system-ui;color:#9a917f;margin-top:4px}.mini svg{display:block;background:#16203c;border:1px solid #c9a24a8c;border-radius:4px;padding:2px}
figure{margin:0;text-align:center}
figure>svg{height:auto;display:block}
figcaption{font:600 13px system-ui;color:#e6dcc6;margin-top:2px}
@media (max-width:760px){#out{grid-template-columns:1fr}}
</style></head><body>
<div class="top" id="metal"></div>
<div id="out"></div>
<script>
const FLAG={
 usa:'<rect width="30" height="20" fill="#fff"/>'+[0,2,4,6,8,10,12].map(i=>`<rect y="${i*1.54}" width="30" height="1.54" fill="#b22234"/>`).join('')+'<rect width="13" height="10.8" fill="#3c3b6e"/>',
 china:'<rect width="30" height="20" fill="#de2910"/><path d="M6 3l1.2 3.6H11L8 8.8l1.1 3.6L6 10.2 2.9 12.4 4 8.8 1 6.6h3.8z" fill="#ffde00"/>',
 japan:'<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>',
 germany:'<rect width="30" height="7" fill="#111"/><rect y="7" width="30" height="6" fill="#dd0000"/><rect y="13" width="30" height="7" fill="#ffce00"/>',
 bangladesh:'<rect width="30" height="20" fill="#006a4e"/><circle cx="13.5" cy="10" r="6" fill="#f42a41"/>',
 uk:'<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.5"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#c8102e" stroke-width="3.5"/>',
}
const NAMES={usa:'USA',china:'China',japan:'Japan',germany:'Germany',bangladesh:'Bangladesh',uk:'UK'}
const METALS={
 pewter:{label:'Pewter',stops:['#3d424a','#c9ced6','#767c86','#eef1f4','#4f555e'],edge:'#2a2e34',hi:'#fff'},
 gold:{label:'Gold',stops:['#5a3c08','#f5d67b','#a87a1e','#fbe7a1','#6e4a0c'],edge:'#3a2a0c',hi:'#fff6d6'},
 lacquer:{label:'Black and gold',stops:['#0d0d10','#3a3a42','#16161a','#4a4a54','#0d0d10'],edge:'#d9b45a',hi:'#f5d67b'},
}
let metal=location.hash.slice(1)in METALS?location.hash.slice(1):'pewter'

// One simple, bold object per country. Each is a single silhouette with at most one enamel accent,
// so it still reads at board size (about 36px).
const ITEMS={
 usa:[['Cowboy hat',`<path d="M-31,-9 Q-28,-1 -17,-4 Q0,0 17,-4 Q28,-1 31,-9 Q26,-13 17,-10 Q0,-6 -17,-10 Q-26,-13 -31,-9 Z"/><path d="M-14,-9 Q-16,-31 -9,-35 Q-4,-37 0,-31 Q4,-37 9,-35 Q16,-31 14,-9 Z"/>`,`<path d="M-14.4,-13 Q0,-10 14.4,-13 L14.2,-18 Q0,-15 -14.2,-18 Z" fill="#7a2a1a"/>`],
       ['Liberty torch',`<path d="M-4.5,0 L-6,-30 H6 L4.5,0 Z"/><path d="M-11,-31 L-9,-39 H9 L11,-31 Z"/><path d="M0,-74 Q15,-57 8,-45 Q4,-39 0,-42 Q-4,-39 -8,-45 Q-15,-57 0,-74 Z"/>`,`<path d="M0,-66 Q8,-55 4,-47 Q2,-44 0,-46 Q-2,-44 -4,-47 Q-8,-55 0,-66 Z" fill="#f2b33d"/>`]],
 china:[['Lantern',`<path d="M0,-60 V-55" stroke="EDGE" stroke-width="2"/><rect x="-9" y="-56" width="18" height="5" rx="1"/><ellipse cx="0" cy="-35" rx="21" ry="17"/><rect x="-9" y="-19" width="18" height="5" rx="1"/><path d="M0,-14 V-6" stroke="EDGE" stroke-width="2"/><ellipse cx="0" cy="-4" rx="3" ry="4"/>`,`<ellipse cx="0" cy="-35" rx="17" ry="14" fill="#c8202f"/><ellipse cx="0" cy="-35" rx="8" ry="14" fill="none" stroke="EDGE" stroke-width="1.2" opacity=".6"/>`],
         ['Panda',`<circle cx="-16" cy="-50" r="8"/><circle cx="16" cy="-50" r="8"/><circle cx="0" cy="-32" r="22"/>`,`<circle cx="-16" cy="-50" r="5.5" fill="#15161a"/><circle cx="16" cy="-50" r="5.5" fill="#15161a"/><ellipse cx="-8" cy="-34" rx="5" ry="7" transform="rotate(30 -8 -34)" fill="#15161a"/><ellipse cx="8" cy="-34" rx="5" ry="7" transform="rotate(-30 8 -34)" fill="#15161a"/><ellipse cx="0" cy="-23" rx="3.5" ry="2.5" fill="#15161a"/>`]],
 japan:[['Paper crane',`<path d="M-33,-52 L-13,-27 L-5,-74 L4,-28 L12,-24 L25,-60 L31,-53 L27,-52 L16,-20 L0,-12 Z"/>`,`<path d="M-5,-74 L0,-12 M-13,-27 L12,-24" stroke="EDGE" stroke-width="1" opacity=".55" fill="none"/>`],
        ['Mount Fuji',`<path d="M-31,0 L-9,-46 Q0,-50 9,-46 L31,0 Z"/>`,`<path d="M-9,-46 Q0,-50 9,-46 L15,-33 L9,-36 L4,-31 L-1,-36 L-6,-32 L-15,-33 Z" fill="#f4f1ea"/>`]],
 germany:[['Pretzel',`<path d="M-21,-23 C-6,-25 10,-33 4,-45 C-2,-57 -26,-55 -26,-37 C-26,-19 -12,-11 0,-11 C12,-11 26,-19 26,-37 C26,-55 2,-57 -4,-45 C-10,-33 6,-25 21,-23" fill="none" stroke="EDGE" stroke-width="12" stroke-linecap="round"/><path d="M-21,-23 C-6,-25 10,-33 4,-45 C-2,-57 -26,-55 -26,-37 C-26,-19 -12,-11 0,-11 C12,-11 26,-19 26,-37 C26,-55 2,-57 -4,-45 C-10,-33 6,-25 21,-23" fill="none" stroke="url(#m)" stroke-width="9" stroke-linecap="round"/>`,``],
           ['Beer stein',`<path d="M12,-40 Q27,-40 27,-26 Q27,-12 12,-12" fill="none" stroke="EDGE" stroke-width="8"/><path d="M12,-40 Q27,-40 27,-26 Q27,-12 12,-12" fill="none" stroke="url(#m)" stroke-width="5"/><rect x="-15" y="-46" width="28" height="46" rx="3"/><path d="M-17,-46 Q-2,-58 15,-46 Z"/>`,`<path d="M-15,-38 H13 M-15,-8 H13" stroke="EDGE" stroke-width="1.4" opacity=".6"/>`]],
 bangladesh:[['Nouka boat',`<path d="M-6,-14 V-66" stroke="EDGE" stroke-width="2.5"/><path d="M-4,-64 Q14,-58 22,-50 Q16,-36 20,-22 L-4,-22 Z"/><path d="M-34,-26 Q-27,-6 0,-6 Q27,-6 34,-26 Q25,-14 0,-15 Q-25,-14 -34,-26 Z"/>`,`<path d="M-4,-48 Q8,-46 18,-42 M-4,-34 Q8,-33 18,-31" stroke="EDGE" stroke-width="1" fill="none" opacity=".5"/>`],
              ['Ilish fish',`<path d="M-2,-26 V0" stroke="EDGE" stroke-width="3"/><path d="M-31,-38 Q-10,-53 14,-44 L29,-53 L24,-38 L29,-23 L14,-32 Q-10,-23 -31,-38 Z"/>`,`<circle cx="-22" cy="-39" r="2.4" fill="#15161a"/><path d="M-15,-45 Q-17,-38 -15,-31" stroke="EDGE" stroke-width="1.2" fill="none" opacity=".6"/>`]],
 uk:[['Crown',`<path d="M-24,-12 L-28,-46 L-13,-31 L0,-56 L13,-31 L28,-46 L24,-12 Z"/><rect x="-25" y="-14" width="50" height="9" rx="1.5"/><circle cx="-28" cy="-47" r="3.5"/><circle cx="0" cy="-57" r="3.5"/><circle cx="28" cy="-47" r="3.5"/>`,`<circle cx="0" cy="-9.5" r="2.8" fill="#c8202f"/><circle cx="-14" cy="-9.5" r="2.2" fill="#1f4fbf"/><circle cx="14" cy="-9.5" r="2.2" fill="#1f4fbf"/>`],
      ['Bowler hat',`<ellipse cx="0" cy="-10" rx="27" ry="7"/><path d="M-17,-11 Q-19,-44 0,-44 Q19,-44 17,-11 Z"/>`,`<path d="M-17.3,-16 Q0,-12 17.3,-16 L17,-21 Q0,-17 -17,-21 Z" fill="#15161a" opacity=".8"/>`]],
}
function defs(){const m=METALS[metal]
 return`<defs><linearGradient id="m" x1="0" x2="1"><stop offset="0" stop-color="${m.stops[0]}"/><stop offset=".3" stop-color="${m.stops[1]}"/><stop offset=".55" stop-color="${m.stops[2]}"/><stop offset=".75" stop-color="${m.stops[3]}"/><stop offset="1" stop-color="${m.stops[4]}"/></linearGradient>
 <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m.stops[3]}"/><stop offset="1" stop-color="${m.stops[2]}"/></linearGradient>
 <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>`}
// round plinth seen from slightly above; its side carries the flag as an enamel band
function plinth(c,id,rx=30){const m=METALS[metal]
 return`<ellipse cx="3" cy="14" rx="${rx+10}" ry="11" fill="url(#sh)"/>
 <clipPath id="band${id}"><path d="M${-rx},0 V9 A${rx},8 0 0 0 ${rx},9 V0 A${rx},8 0 0 1 ${-rx},0 Z"/></clipPath>
 <g clip-path="url(#band${id})"><g transform="translate(${-rx},-2) scale(${rx*2/30},${19/20})">${FLAG[c]}</g><rect x="${-rx}" y="-2" width="${rx*2}" height="20" fill="url(#m)" opacity=".28"/></g>
 <path d="M${-rx},9 A${rx},8 0 0 0 ${rx},9" fill="none" stroke="url(#m)" stroke-width="3"/>
 <ellipse cx="0" cy="0" rx="${rx}" ry="8" fill="url(#mt)" stroke="${m.edge}" stroke-width="1"/>
 <ellipse cx="0" cy="0" rx="${rx-4}" ry="5.6" fill="none" stroke="${m.hi}" stroke-opacity=".35" stroke-width="1"/>`}
function token(c,k,size){const[name,body,detail]=ITEMS[c][k],m=METALS[metal],id=c+k+size
 const inner=`${plinth(c,id,26)}<g fill="url(#m)" stroke="${m.edge}" stroke-width="1.2" stroke-linejoin="round">${body.replaceAll('EDGE',m.edge)}</g>${detail.replaceAll('EDGE',m.edge)}`
 return`<svg viewBox="-40 -80 80 98" style="width:${size}px">${defs()}${inner}</svg>`}
const svg=null
const C=['usa','china','japan','germany','bangladesh','uk']
function render(){
 document.getElementById('metal').innerHTML='Metal: '+Object.entries(METALS).map(([k,v])=>`<button aria-pressed="${k===metal}" onclick="metal='${k}';location.hash='${k}';render()">${v.label}</button>`).join('')
 document.getElementById('out').innerHTML=`<section><h2>Pick one per country</h2><p>Each token is one simple object from that country, cast in metal, with the flag round its base. "On board" shows the real size during play.</p></section>`+
  C.map(c=>`<section><h2>${NAMES[c]}</h2><div class="pair">${[0,1].map(k=>`<figure>${token(c,k,150)}<figcaption>${ITEMS[c][k][0]}</figcaption><span class="mini">On board ${token(c,k,38)}</span></figure>`).join('')}</div></section>`).join('')}
render()
</script></body></html>
