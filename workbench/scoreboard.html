<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 5: Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* Step 5: the scoreboard. Built around money: coins now, and FDI projects paying in over the next turns.
   Debt and statuses only appear when someone has them. Three layouts to compare. */
:root{--navy:#0d1530;--navy2:#141e3d;--gold:#c9a24a;--gold2:#f5d67b;--ink:#efe6d2;--mute:#a59c88;--green:#3fd39b;--red:#ff6b78}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#1a0f08 url(wood.jpg) center/cover fixed;min-height:100vh;color:var(--ink);font:14px/1.35 system-ui}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0000 40%,#0008 100%);pointer-events:none}
.top{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 16px 0}
.top button{font:600 14px system-ui;padding:9px 14px;border-radius:999px;border:1px solid #c9a24a66;background:#0d1426cc;color:var(--ink);cursor:pointer}
.top button[aria-pressed=true]{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.top .act{background:linear-gradient(#2a2f3d,#0b0e15);border-color:#e3bd6a;color:var(--gold2)}
.note{position:relative;max-width:640px;margin:10px auto 0;text-align:center;color:#d9d2c2;background:#0b1020b3;padding:8px 14px;border-radius:10px}
.stage{position:relative;display:grid;gap:18px;padding:18px 16px 40px;max-width:1240px;margin:0 auto;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.board{aspect-ratio:1;border:5px solid #b8892e;border-radius:10px;background:#101830 url(board-bg.jpg) center/cover;box-shadow:0 18px 40px -10px #000c;position:relative;overflow:hidden}
.board::after{content:"Board";position:absolute;inset:0;display:grid;place-items:center;background:#101830d9;font:600 18px Fraunces,serif;color:#c9a24a88;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:860px){.stage{grid-template-columns:1fr}.board{max-width:520px;width:100%;justify-self:center}}

/* shared bits */
.flag{display:inline-block;width:26px;height:18px;border-radius:3px;overflow:hidden;flex:none;box-shadow:0 0 0 1px #0006,0 0 0 2px #c9a24a55}
.flag svg{display:block;width:100%;height:100%}
.gem{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;flex:none;box-shadow:0 0 0 1.5px #c9a24a,0 0 8px var(--pc)}
.coin{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2c35a 45%,#a8770f);box-shadow:inset 0 0 0 2px #b8892e,0 1px 2px #0008}
.num{font:700 26px Fraunces,Georgia,serif;font-variant-numeric:tabular-nums;color:var(--gold2)}
.tag{font:600 11px system-ui;padding:2px 7px;border-radius:999px;border:1px solid}
.tag.debt{color:var(--red);border-color:#ff6b7866;background:#ff6b7814}
.tag.status{color:#ffc46b;border-color:#ffc46b55;background:#ffc46b12}
.waiver{display:inline-flex;align-items:center;gap:4px;font:600 12px system-ui;color:var(--mute)}
.waiver i{width:14px;height:10px;border-radius:2px;background:repeating-linear-gradient(90deg,#efe6d2 0 2px,#d8cdb4 2px 4px);box-shadow:0 0 0 1px #c9a24a}
/* cash-flow strip: what arrives in each of the next four turns */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:end;height:46px}
.flow div{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.flow b{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(#3fd39b,#1c8f66);min-height:0;transition:height .5s}
.flow b.zero{background:#ffffff14;height:2px!important}
.flow span{font:700 11px system-ui;color:var(--green);margin-bottom:2px}
.flow em{position:absolute;bottom:-15px;font:600 9.5px system-ui;color:var(--mute);font-style:normal}
.flow div:first-child em{color:var(--gold2)}
.none{font-size:12px;color:var(--mute);align-self:center}
.float{position:absolute;font:700 20px Fraunces,serif;color:var(--green);text-shadow:0 2px 6px #000;pointer-events:none;animation:up 1.4s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-38px)}}
.pay{animation:pay .9s ease}@keyframes pay{30%{color:#fff;text-shadow:0 0 14px #3fd39b}}

/* A: ledger cards */
.A{display:grid;gap:10px}
.A .card{position:relative;background:linear-gradient(var(--navy2),var(--navy));border:1px solid #c9a24a44;border-left:4px solid var(--pc);border-radius:10px;padding:10px 12px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;box-shadow:0 8px 20px -10px #000}
.A .card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px -4px var(--pc)}
.A .who{display:flex;align-items:center;gap:8px;min-width:0}
.A .who b{font:600 15px Fraunces,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.A .who small{display:block;color:var(--mute);font-size:11px}
.A .cash{display:flex;align-items:center;gap:6px;justify-self:end}
.A .row2{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end}
.A .lbl{font:600 10px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg);align-self:center}
.A .tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:860px){.A{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.A .card{grid-template-columns:1fr;padding:9px 10px 20px}.A .cash{justify-self:start}.A .who small{display:none}.A .num{font-size:22px}}

/* B: ticker rows, one line per player */
.B{background:linear-gradient(var(--navy2),var(--navy));border:1px solid #c9a24a55;border-radius:12px;overflow:hidden}
.B .row{position:relative;display:grid;grid-template-columns:4px auto 1fr auto 120px;gap:10px;align-items:center;padding:9px 12px 20px 0;border-top:1px solid #c9a24a22}
.B .row:first-child{border-top:0}.B .row.on{background:#c9a24a14}
.B .stripe{align-self:stretch;background:var(--pc)}
.B .who{display:flex;align-items:center;gap:8px;min-width:0}.B .who b{font:600 14px Fraunces,serif}
.B .tags{display:flex;gap:4px;flex-wrap:wrap}
.B .cash{display:flex;align-items:center;gap:5px}.B .num{font-size:22px}
.B .flow{height:34px}
@media (max-width:420px){.B .row{grid-template-columns:4px 1fr auto 96px}.B .tags{display:none}}

/* C: brass plaques, compact; tap one to open its detail */
.C{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.C .plq{position:relative;text-align:center;padding:10px 8px 8px;border-radius:12px;cursor:pointer;color:#1d1406;
 background:linear-gradient(160deg,#fbe7a1,#d9a845 40%,#b8892e 70%,#f0cf7a);box-shadow:inset 0 0 0 2px #fff2c0aa,inset 0 0 0 5px #8a6420,0 8px 18px -8px #000}
.C .plq.on{outline:2px solid var(--pc);outline-offset:3px}
.C .plq .flag{display:block;margin:0 auto 4px}
.C .plq b{display:block;font:700 13px Fraunces,serif}
.C .plq .num{color:#1d1406;font-size:24px;display:block}
.C .plq .nx{display:block;font:700 12px system-ui;color:#0d5a3e}
.C .plq .nx.zero{color:#6b5320;font-weight:600}
.C .plq .gem{position:absolute;top:9px;right:9px}
.C .plq .dbt{display:block;font:700 10px system-ui;color:#9b1c2b}
.C .detail{grid-column:1/-1;background:linear-gradient(var(--navy2),var(--navy));border:1px solid #c9a24a55;border-radius:12px;padding:10px 14px 22px}
.C .detail h4{margin:0 0 6px;font:600 14px Fraunces,serif;color:var(--gold2)}
@media (min-width:861px){.C{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="top" id="top"></div>
<p class="note" id="note"></p>
<div class="stage"><div class="board"></div><div id="sb"></div></div>
<script>
const FLAG={
 usa:'<rect width="30" height="20" fill="#fff"/>'+[0,2,4,6,8,10,12].map(i=>`<rect y="${i*1.54}" width="30" height="1.54" fill="#b22234"/>`).join('')+'<rect width="13" height="10.8" fill="#3c3b6e"/>',
 china:'<rect width="30" height="20" fill="#de2910"/><path d="M6 3l1.2 3.6H11L8 8.8l1.1 3.6L6 10.2 2.9 12.4 4 8.8 1 6.6h3.8z" fill="#ffde00"/>',
 japan:'<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>',
 germany:'<rect width="30" height="7" fill="#111"/><rect y="7" width="30" height="6" fill="#dd0000"/><rect y="13" width="30" height="7" fill="#ffce00"/>',
 bangladesh:'<rect width="30" height="20" fill="#006a4e"/><circle cx="13.5" cy="10" r="6" fill="#f42a41"/>',
 uk:'<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.5"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#c8102e" stroke-width="3.5"/>',
}
const PC=['#2f7de8','#e0442c','#17a673','#8e5cf0','#e0569a','#1fb5c9']
// sample mid-game state (made up for the preview)
const START=[
 {name:'Ana',c:'usa',country:'USA',sq:24,cap:14,wv:1,debt:0,st:[],pj:[{p:6,t:1},{p:4,t:3}]},
 {name:'Bo',c:'china',country:'China',sq:32,cap:9,wv:0,debt:0,st:[],pj:[{p:8,t:2}]},
 {name:'Kenji',c:'japan',country:'Japan',sq:37,cap:21,wv:2,debt:0,st:[],pj:[]},
 {name:'Lena',c:'germany',country:'Germany',sq:8,cap:6,wv:0,debt:2,st:[],pj:[{p:3,t:1},{p:3,t:2},{p:5,t:4}]},
 {name:'Rafi',c:'bangladesh',country:'Bangladesh',sq:61,cap:12,wv:1,debt:0,st:[],pj:[{p:10,t:4}]},
 {name:'Will',c:'uk',country:'UK',sq:50,cap:4,wv:0,debt:0,st:['Rate hike (2)'],pj:[]},
]
let P=structuredClone(START),active=0
let mode=location.hash.slice(1)in{A:1,B:1,C:1}?location.hash.slice(1):'A',open=0
const OPTS={A:['A. Ledger cards','One card per player. Coins top right; under it, a bar for each of the next four turns showing FDI money arriving.'],
 B:['B. Ticker rows','One compact row per player, like a stock ticker. Everyone fits in one glance, even with six players.'],
 C:['C. Brass plaques','Small brass plaques show coins and next turn\'s income. Tap a plaque for its full cash flow.']}
const flag=c=>`<span class="flag"><svg viewBox="0 0 30 20" preserveAspectRatio="none">${FLAG[c]}</svg></span>`
const sumAt=(p,k)=>p.pj.filter(x=>x.t===k).reduce((a,x)=>a+x.p,0)
function flow(p){const v=[1,2,3,4].map(k=>sumAt(p,k)),mx=Math.max(10,...v)
 return `<div class="flow">${v.map((x,k)=>`<div>${x?`<span>+${x}</span>`:''}<b class="${x?'':'zero'}" style="height:${x/mx*70}%"></b><em>${k?'in '+(k+1):'next'}</em></div>`).join('')}</div>`}
const tags=p=>[p.debt?`<span class="tag debt">Debt ${p.debt}</span>`:'',...p.st.map(s=>`<span class="tag status">${s}</span>`)].join('')
const cash=p=>`<span class="coin"></span><span class="num" data-cap="${P.indexOf(p)}">${p.cap}</span>`
function render(){
 document.getElementById('top').innerHTML=Object.entries(OPTS).map(([k,[n]])=>`<button aria-pressed="${k===mode}" onclick="mode='${k}';location.hash='${k}';render()">${n}</button>`).join('')+
  `<button class="act" onclick="endTurn()">End turn: projects pay out</button>`
 document.getElementById('note').textContent=OPTS[mode][1]
 const sb=document.getElementById('sb');sb.className=mode
 if(mode==='A')sb.innerHTML=P.map((p,i)=>`<article class="card ${i===active?'on':''}" style="--pc:${PC[i]}">
  <div class="who">${flag(p.c)}<div><b>${p.name}</b><small>${p.country} · square ${p.sq}</small></div></div>
  <div class="cash">${cash(p)}${p.wv?`<span class="waiver" title="Tariff waivers"><i></i>${p.wv}</span>`:''}</div>
  <div class="row2"><span class="lbl">FDI in</span>${p.pj.length?flow(p):'<span class="none">No projects yet</span>'}</div>
  ${tags(p)?`<div class="tags">${tags(p)}</div>`:''}</article>`).join('')
 if(mode==='B')sb.innerHTML=P.map((p,i)=>`<div class="row ${i===active?'on':''}" style="--pc:${PC[i]}"><span class="stripe"></span>
  <div class="who">${flag(p.c)}<b>${p.name}</b></div><div class="tags">${tags(p)}</div><div class="cash">${cash(p)}</div>
  ${p.pj.length?flow(p):'<span class="none">No projects</span>'}</div>`).join('')
 if(mode==='C'){const q=P[open];sb.innerHTML=P.map((p,i)=>{const nx=sumAt(p,1)
  return `<div class="plq ${i===active?'on':''}" style="--pc:${PC[i]}" onclick="open=${i};render()"><span class="gem" style="background:${PC[i]}"></span>
  ${flag(p.c)}<b>${p.name}</b><span class="num" data-cap="${i}">${p.cap}</span><span class="nx ${nx?'':'zero'}">${nx?`+${nx} next turn`:p.pj.length?'income later':'no projects'}</span>${p.debt?`<span class="dbt">Debt ${p.debt}</span>`:''}</div>`}).join('')+
  `<div class="detail"><h4>${q.name} · ${q.country} · square ${q.sq}</h4>${q.pj.length?flow(q):'<span class="none">No projects yet</span>'}${tags(q)?`<div style="margin-top:20px;display:flex;gap:6px">${tags(q)}</div>`:''}</div>`}}
// demo: every project moves one turn closer; those due now pay out with a floating +amount and a count-up
function endTurn(){const paid=[]
 P.forEach((p,i)=>{const due=p.pj.filter(x=>x.t===1).reduce((a,x)=>a+x.p,0);p.pj=p.pj.map(x=>({...x,t:x.t-1})).filter(x=>x.t>0);if(due)paid.push([i,p.cap,due]);p.cap+=due})
 active=(active+1)%P.length;render()
 paid.forEach(([i,from,due])=>{const el=document.querySelector(`[data-cap="${i}"]`);if(!el)return;el.textContent=from
  const f=document.createElement('span');f.className='float';f.textContent='+'+due;const r=el.getBoundingClientRect();f.style.left=r.right+scrollX+4+'px';f.style.top=r.top+scrollY-4+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1500)
  const t0=performance.now(),tick=t=>{const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(from+due*k);k<1?requestAnimationFrame(tick):el.classList.add('pay')};requestAnimationFrame(tick)})
 if(P.every(p=>!p.pj.length))setTimeout(()=>{P=structuredClone(START);render()},1800)}
render()
</script></body></html>
