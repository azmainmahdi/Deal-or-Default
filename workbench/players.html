<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 5: Player Rows</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Step 5, round 3: friendly player rows. What players care about: whose turn, who's ahead in the race,
   coins, and money on its way. Plain words, big numbers, playful motion. Two variants. */
:root{--navy:#121b38;--navy2:#1a2550;--gold:#e9bd55;--ink:#f6f1e6;--mute:#aab0c6;--green:#46e0a4;--red:#ff7a86}
*{box-sizing:border-box}html,body{margin:0}
body{background:#1a0f08 url(wood.jpg) center/cover fixed;min-height:100vh;color:var(--ink);font:15px/1.3 Nunito,system-ui}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0000 40%,#0008 100%);pointer-events:none}
.top{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 16px 0}
.top button{font:800 14px Nunito;padding:9px 16px;border-radius:999px;border:0;background:#0d1426d9;color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff22}
.top button[aria-pressed=true]{background:var(--gold);color:#2a1a00}
.top .act{background:var(--green);color:#06301f}
.note{position:relative;max-width:620px;margin:10px auto 0;text-align:center;color:#e6e1d5;background:#0b1020b3;padding:8px 14px;border-radius:12px}
.stage{position:relative;display:grid;gap:18px;padding:18px 16px 40px;max-width:1280px;margin:0 auto;grid-template-columns:minmax(0,1fr) 420px;align-items:start}
.board{aspect-ratio:1;border:5px solid #b8892e;border-radius:10px;background:#101830 url(board-bg.jpg) center/cover;box-shadow:0 18px 40px -10px #000c;position:relative;overflow:hidden}
.board::after{content:"Board";position:absolute;inset:0;display:grid;place-items:center;background:#101830d9;font:800 18px Nunito;color:#c9a24a88;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:900px){.stage{grid-template-columns:1fr}.board{max-width:520px;width:100%;justify-self:center}}
.list{display:grid;gap:8px}
.flag{display:block;width:100%;height:100%}
.coin{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff6cf,#f5c94e 45%,#b9820f);box-shadow:inset 0 0 0 2px #c8901c,inset 0 0 0 4px #f8d76a,0 2px 3px #0007;position:relative}
.coin::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid #c8901c88}
.coin.sm{width:16px;height:16px}.coin.sm::after{inset:5px}
.fly{position:fixed;z-index:9;pointer-events:none}

/* row shell shared by both variants */
.row{position:relative;display:grid;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:linear-gradient(180deg,var(--navy2),var(--navy));
 box-shadow:0 6px 16px -8px #000,inset 0 1px 0 #ffffff14;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.row.on{transform:translateX(-8px) scale(1.02);box-shadow:0 0 0 2.5px var(--pc),0 10px 24px -6px var(--pc)}
.ava{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--pc),0 0 0 5px #0006}
.ava svg{width:100%;height:100%;display:block}
.name{font:900 16px Nunito;line-height:1.1}
.turn{display:inline-block;margin-left:6px;font:900 11px Nunito;padding:2px 8px;border-radius:999px;background:var(--pc);color:#fff;vertical-align:2px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.sub{font:700 12px Nunito;color:var(--mute)}
.cash{display:flex;align-items:center;gap:6px;justify-self:end}
.cash .n{font:900 26px Nunito;font-variant-numeric:tabular-nums;color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font:800 12px Nunito;padding:3px 9px 3px 4px;border-radius:999px;background:#46e0a41f;color:var(--green);white-space:nowrap}
.chip.soon{background:var(--green);color:#06301f;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px #46e0a433}}
.chip.warn{background:#ff7a861f;color:var(--red);padding-left:9px}
.chip.info{background:#ffd27a1f;color:#ffd27a;padding-left:9px}
.more{grid-column:1/-1;display:none;gap:6px;flex-wrap:wrap;padding-top:4px}
.row.open .more{display:flex}
/* the race to 100 */
.race{position:relative;height:8px;border-radius:99px;background:#ffffff14;margin-top:6px}
.race b{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#ffffff22,var(--pc));transition:width .8s}
.race i{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--pc),0 1px 3px #000;transition:left .8s}
.race s{position:absolute;right:-2px;top:-7px;width:10px;height:22px;text-decoration:none}

/* Variant 1: Race rows */
.V1 .row{grid-template-columns:44px 1fr auto}
.V1 .mid{min-width:0}
.V1 .income{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}

/* Variant 2: Bubble rows: money on its way sits on a little four-dot timeline */
.V2 .row{grid-template-columns:52px 1fr auto;padding:12px 14px}
.V2 .ava{width:52px;height:52px}
.V2 .line{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;max-width:210px}
.V2 .slot{position:relative;height:30px;display:grid;place-items:center}
.V2 .slot::before{content:"";position:absolute;left:0;right:-4px;top:50%;height:2px;background:#ffffff1a}
.V2 .slot:last-child::before{right:50%}
.V2 .dot{position:relative;width:8px;height:8px;border-radius:50%;background:#ffffff33}
.V2 .bub{position:relative;display:flex;align-items:center;gap:2px;font:900 12px Nunito;color:#06301f;background:var(--green);padding:2px 7px 2px 3px;border-radius:999px;box-shadow:0 3px 8px -2px #46e0a499}
.V2 .slot:first-child .bub{animation:pulse 1.6s ease-in-out infinite}
.V2 .lbls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:210px;font:800 10px Nunito;color:var(--mute);text-align:center}
.V2 .lbls span:first-child{color:var(--green)}
.V2 .none{font:700 12px Nunito;color:var(--mute);margin-top:8px}
.V2 .pos{font:800 12px Nunito;color:var(--mute)}
.V2 .pos b{color:#fff}
@media (max-width:420px){.V2 .row{grid-template-columns:44px 1fr auto;padding:10px}.V2 .ava{width:44px;height:44px}.cash .n{font-size:22px}}
</style></head><body>
<div class="top" id="top"></div>
<p class="note" id="note"></p>
<div class="stage"><div class="board"></div><div id="sb" class="list"></div></div>
<script>
const FLAG={
 usa:'<rect width="30" height="20" fill="#fff"/>'+[0,2,4,6,8,10,12].map(i=>`<rect y="${i*1.54}" width="30" height="1.54" fill="#b22234"/>`).join('')+'<rect width="13" height="10.8" fill="#3c3b6e"/>',
 china:'<rect width="30" height="20" fill="#de2910"/><path d="M6 3l1.2 3.6H11L8 8.8l1.1 3.6L6 10.2 2.9 12.4 4 8.8 1 6.6h3.8z" fill="#ffde00"/>',
 japan:'<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>',
 germany:'<rect width="30" height="7" fill="#111"/><rect y="7" width="30" height="6" fill="#dd0000"/><rect y="13" width="30" height="7" fill="#ffce00"/>',
 bangladesh:'<rect width="30" height="20" fill="#006a4e"/><circle cx="13.5" cy="10" r="6" fill="#f42a41"/>',
 uk:'<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.5"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#c8102e" stroke-width="3.5"/>',
}
const PC=['#2f7de8','#e0442c','#17a673','#8e5cf0','#e0569a','#1fb5c9']
// sample mid-game state (made up for the preview)
const START=[
 {name:'Ana',c:'usa',country:'USA',sq:24,cap:14,debt:0,st:[],pj:[{p:6,t:1},{p:4,t:3}]},
 {name:'Bo',c:'china',country:'China',sq:32,cap:9,debt:0,st:[],pj:[{p:8,t:2}]},
 {name:'Kenji',c:'japan',country:'Japan',sq:37,cap:21,debt:0,st:[],pj:[]},
 {name:'Lena',c:'germany',country:'Germany',sq:8,cap:6,debt:2,st:[],pj:[{p:3,t:1},{p:3,t:2},{p:5,t:4}]},
 {name:'Rafi',c:'bangladesh',country:'Bangladesh',sq:61,cap:12,debt:0,st:[],pj:[{p:10,t:4}]},
 {name:'Will',c:'uk',country:'UK',sq:50,cap:4,debt:0,st:['Rate hike: 2 turns'],pj:[]},
]
let P=structuredClone(START),active=0,openRow=-1
const OPTS={V1:['1. Race rows','Who\'s ahead in the race to 100, coins, and money on its way in plain words. Tap a row for more.'],
 V2:['2. Bubble rows','Bigger avatars. Money on its way sits on a little four-turn line, so you see when it lands. Tap a row for more.']}
let mode=location.hash.slice(1)in OPTS?location.hash.slice(1):'V1'
const ava=c=>`<div class="ava"><svg viewBox="5 0 20 20" preserveAspectRatio="xMidYMid slice">${FLAG[c]}</svg></div>`
const when=t=>t===1?'next turn':`in ${t} turns`
const race=p=>`<div class="race" title="Square ${p.sq} of 100"><b style="width:${p.sq}%"></b><i style="left:${p.sq}%"></i><s><svg viewBox="0 0 10 22"><path d="M2 2v18" stroke="#fff" stroke-width="1.6"/><path d="M2.6 2.5h6.5l-2 3 2 3H2.6z" fill="var(--gold)"/></svg></s></div>`
const extra=p=>[p.debt?`<span class="chip warn">Owes ${p.debt} coins</span>`:'',...p.st.map(s=>`<span class="chip info">${s}</span>`),`<span class="chip info" style="background:#ffffff12;color:var(--mute)">Square ${p.sq} of 100</span>`].join('')
function render(){
 document.getElementById('top').innerHTML=Object.entries(OPTS).map(([k,[n]])=>`<button aria-pressed="${k===mode}" onclick="mode='${k}';location.hash='${k}';render()">${n}</button>`).join('')+`<button class="act" onclick="endTurn()">Next turn</button>`
 document.getElementById('note').textContent=OPTS[mode][1]
 const sb=document.getElementById('sb');sb.className='list '+mode
 sb.innerHTML=P.map((p,i)=>{const on=i===active,cls=`row ${on?'on':''} ${openRow===i?'open':''}`,pj=[...p.pj].sort((a,b)=>a.t-b.t)
  if(mode==='V1')return`<div class="${cls}" style="--pc:${PC[i]}" onclick="openRow=openRow===${i}?-1:${i};render()">${ava(p.c)}
   <div class="mid"><div class="name">${p.name}${on?'<span class="turn">Your turn</span>':''}</div>${race(p)}</div>
   <div class="cash"><span class="coin"></span><span class="n" data-cap="${i}">${p.cap}</span></div>
   <div class="income">${pj.length?pj.map(x=>`<span class="chip ${x.t===1?'soon':''}"><span class="coin sm"></span>+${x.p} ${when(x.t)}</span>`).join(''):'<span class="sub">No money on its way yet</span>'}${p.debt?'<span class="chip warn">Owes '+p.debt+'</span>':''}</div>
   <div class="more">${extra(p)}</div></div>`
  return`<div class="${cls}" style="--pc:${PC[i]}" onclick="openRow=openRow===${i}?-1:${i};render()">${ava(p.c)}
   <div><div class="name">${p.name}${on?'<span class="turn">Your turn</span>':''}</div><div class="pos">Square <b>${p.sq}</b>${p.debt?` · <span style="color:var(--red)">owes ${p.debt}</span>`:''}</div>
   ${pj.length?`<div class="line">${[1,2,3,4].map(k=>{const v=p.pj.filter(x=>x.t===k).reduce((a,x)=>a+x.p,0);return`<div class="slot">${v?`<span class="bub"><span class="coin sm"></span>+${v}</span>`:'<span class="dot"></span>'}</div>`}).join('')}</div>
   <div class="lbls"><span>next</span><span>in 2</span><span>in 3</span><span>in 4</span></div>`:'<div class="none">No money on its way yet</div>'}</div>
   <div class="cash"><span class="coin"></span><span class="n" data-cap="${i}">${p.cap}</span></div><div class="more">${extra(p)}</div></div>`}).join('')}
// demo: money due next turn flies into the coin total, which counts up; the turn moves on
function endTurn(){const paid=[]
 P.forEach((p,i)=>{const due=p.pj.filter(x=>x.t===1).reduce((a,x)=>a+x.p,0);if(due){const src=document.querySelector(`.row:nth-child(${i+1}) .soon, .row:nth-child(${i+1}) .slot:first-child .bub`);paid.push([i,p.cap,due,src&&src.getBoundingClientRect()])}
  p.pj=p.pj.map(x=>({...x,t:x.t-1})).filter(x=>x.t>0);p.cap+=due})
 P[active].sq=Math.min(99,P[active].sq+1+Math.floor(Math.random()*6))
 active=(active+1)%P.length;render()
 paid.forEach(([i,from,due,r])=>{const el=document.querySelector(`[data-cap="${i}"]`);if(!el)return;el.textContent=from;const to=el.getBoundingClientRect()
  for(let k=0;k<Math.min(6,due);k++){const c=document.createElement('span');c.className='coin fly';const sx=r?r.left+10:to.left-60,sy=r?r.top:to.top
   c.style.left=sx+'px';c.style.top=sy+'px';document.body.appendChild(c)
   c.animate([{transform:'translate(0,0) scale(.7)',opacity:0},{transform:`translate(${(to.left-sx)/2}px,${(to.top-sy)/2-40}px) scale(1)`,opacity:1,offset:.5},{transform:`translate(${to.left-sx}px,${to.top-sy}px) scale(.6)`,opacity:.9}],{duration:650,delay:k*70,easing:'ease-in-out'}).onfinish=()=>c.remove()}
  const t0=performance.now()+450,tick=t=>{const k=Math.max(0,Math.min(1,(t-t0)/600));el.textContent=Math.round(from+due*k);if(k<1)requestAnimationFrame(tick);else el.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:300})};requestAnimationFrame(tick)})
 if(P.every(p=>!p.pj.length))setTimeout(()=>{P=structuredClone(START);render()},2000)}
render()
</script></body></html>
