<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 6: Decisions</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@700;800;900&family=Federo&display=swap" rel="stylesheet">
<style>
/* Step 6: the decision panel. Whatever the game asks (ladder, crash, tariff, card, takeover) opens over
   the board in the black-and-gold Deco style of the players panel. Each choice says what happens, in plain words. */
:root{--bg:#0b0a09;--bg2:#1a1814;--gold:#d8b05a;--gold2:#f5dc94;--ink:#f3ecdc;--mute:#a39a86;--green:#4fdcaa;--red:#ff8590}
*{box-sizing:border-box}html,body{margin:0}
body{background:#1a0f08 url(wood.jpg) center/cover fixed;min-height:100vh;color:var(--ink);font:15px/1.35 Nunito,system-ui}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0000 40%,#0008 100%);pointer-events:none}
.top{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 16px 0;z-index:3}
.top button{font:800 14px Nunito;padding:9px 16px;border-radius:999px;border:1px solid #d8b05a66;background:linear-gradient(#22201b,#0b0a09);color:var(--gold2);cursor:pointer}
.top button[aria-pressed=true]{background:var(--gold);color:#1a1206}
.stage{position:relative;max-width:760px;margin:16px auto 40px;padding:0 16px}
.board{position:relative;aspect-ratio:1;border:5px solid #b8892e;border-radius:10px;background:#101830 url(board-bg.jpg) center/cover;box-shadow:0 18px 40px -10px #000c;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:#101830cc}
.dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#000a,#000d);opacity:0;transition:opacity .35s}
.dim.on{opacity:1}

/* the panel: black, double gold rule, stepped corners; rises in */
.panel{position:absolute;left:50%;top:50%;width:min(560px,calc(100% - 28px));transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .3s;
 padding:32px 32px 28px;background:linear-gradient(180deg,var(--bg2),var(--bg));
 clip-path:polygon(16px 0,calc(100% - 16px) 0,calc(100% - 16px) 7px,calc(100% - 7px) 7px,calc(100% - 7px) 16px,100% 16px,100% calc(100% - 16px),calc(100% - 7px) calc(100% - 16px),calc(100% - 7px) calc(100% - 7px),calc(100% - 16px) calc(100% - 7px),calc(100% - 16px) 100%,16px 100%,16px calc(100% - 7px),7px calc(100% - 7px),7px calc(100% - 16px),0 calc(100% - 16px),0 16px,7px 16px,7px 7px,16px 7px)}
.panel.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.panel::before{content:"";position:absolute;inset:12px;border:1px solid #d8b05a66;outline:1px solid #d8b05a26;outline-offset:3px;pointer-events:none}
.head{display:flex;align-items:center;gap:12px}
.icon{width:54px;height:54px;flex:none;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1.5px var(--gold),0 4px 10px #000}
.icon img{width:100%;height:100%;display:block}
.kind{font:800 10.5px Nunito;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.title{font:800 21px/1.15 Fraunces;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font:800 13px Nunito;color:var(--mute)}
.who i{width:26px;height:26px;border-radius:7px;background:var(--art) center 30%/150%;box-shadow:0 0 0 1.5px var(--gold)}
.who b{color:var(--gold2)}
.rule{height:1px;margin:12px 0;background:linear-gradient(90deg,transparent,#d8b05a77,transparent)}
.lead{color:#d9d1bf;margin:0 0 12px}
.num{font-family:Federo}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;position:relative;background:radial-gradient(circle at 35% 30%,#fff5cf,#f0c55a 45%,#a8770f);box-shadow:inset 0 0 0 1.5px #b8892e,0 1px 2px #0008}
.coin::after{content:"";position:absolute;inset:6px;transform:rotate(45deg);border:1px solid #a8770f99}

/* choice cards: big tap targets, what happens written under each */
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;cursor:pointer;padding:14px 14px 12px;border-radius:12px;border:1px solid #d8b05a44;background:#ffffff08;color:var(--ink);font:inherit;transition:transform .15s,border-color .15s,background .15s}
.opt:hover,.opt:focus-visible{transform:translateY(-2px);border-color:var(--gold);background:#d8b05a12;outline:none}
.opt.best{border-color:var(--gold);background:linear-gradient(180deg,#d8b05a22,#d8b05a08)}
.opt b{display:block;font:800 16px Fraunces;margin-bottom:4px}
.opt>span{display:block;color:#cfc6b2;font-size:13.5px}
.opt .good{color:var(--green);font-weight:800}.opt .bad{color:var(--red);font-weight:800}
.opt kbd{position:absolute;top:10px;right:10px;font:800 10px Nunito;color:var(--mute);border:1px solid #ffffff22;border-radius:4px;padding:1px 5px}
.opt.full{grid-column:1/-1}
/* ladder: pick coins, see the payout land on the turn line */
.pick{display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0 10px}
.pick button{width:44px;height:44px;border-radius:50%;cursor:pointer;border:0;font:400 18px Federo;color:#2a1a00;background:radial-gradient(circle at 35% 30%,#fff5cf,#f0c55a 45%,#a8770f);box-shadow:inset 0 0 0 2px #b8892e,0 3px 6px #000a;opacity:.35;transition:opacity .15s,transform .15s}
.pick button.on{opacity:1;transform:translateY(-3px)}
.pick .zero{background:#ffffff10;color:var(--mute);box-shadow:inset 0 0 0 1px #ffffff33;opacity:1;font:800 12px Nunito;width:auto;padding:0 12px;border-radius:999px}
.pick .zero.on{background:#ffffff22;color:#fff;transform:none}
.deal{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:#ffffff08;border:1px solid #d8b05a33;margin-bottom:12px}
.deal .big{font:400 30px Federo;color:var(--gold2);line-height:1}
.deal small{display:block;font:800 10px Nunito;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.line{display:grid;grid-template-columns:repeat(4,1fr);margin:2px 4px 0}
.slot{position:relative;height:24px;display:grid;place-items:center}
.slot::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#d8b05a44}.slot:first-child::before{left:50%}.slot:last-child::before{right:50%}
.dia{position:relative;width:7px;height:7px;transform:rotate(45deg);border:1px solid #d8b05a99;background:var(--bg)}
.pill{position:relative;padding:1px 8px;border-radius:999px;font:400 13px Federo;color:#06301f;background:linear-gradient(#b8ffe2,#4fdcaa);box-shadow:0 0 12px -2px #4fdcaa}
.lbls{display:grid;grid-template-columns:repeat(4,1fr);font:800 9px Nunito;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:center;margin:0 4px}
.hint{font-size:12.5px;color:var(--mute);text-align:center;margin:-2px 0 12px}
.go{display:flex;gap:10px}
.btn{flex:1;cursor:pointer;padding:13px 16px;border-radius:999px;font:900 15px Nunito;border:1px solid #d8b05a66;background:transparent;color:var(--ink)}
.btn.primary{border:0;color:#241800;background:linear-gradient(#f9e3a0,#d8b05a);box-shadow:0 6px 16px -6px #d8b05a}
/* event card */
.card{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.ev{aspect-ratio:3/4;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;background:linear-gradient(160deg,#3a0f16,#1a0508);box-shadow:0 0 0 1.5px var(--gold),inset 0 0 0 5px #1a0508,inset 0 0 0 6px #d8b05a66,0 8px 18px -6px #000}
.ev small{font:800 8.5px Nunito;letter-spacing:.2em;color:#ff9aa5}.ev b{font:800 15px/1.1 Fraunces;color:var(--gold2)}.ev svg{width:30px;height:30px;margin:0 auto}
/* takeover: pick a rival */
.vics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vic{text-align:center}.vic .por{width:56px;height:56px;margin:0 auto 6px;border-radius:12px;background:var(--art) center 30%/150%;box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--bg)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:#0b0a09ee;border:1px solid var(--gold);color:var(--gold2);font:800 14px Nunito;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.on{opacity:1}
@media (max-width:560px){.panel{position:fixed;top:auto;bottom:8px;width:calc(100% - 16px);max-height:86vh;overflow:auto;z-index:5;transform:translate(-50%,30px);padding:18px 16px 14px}.panel.on{transform:translate(-50%,0)}.dim{position:fixed;z-index:4}.deal{grid-template-columns:1fr 1fr}.deal>div:nth-child(2){grid-column:1/-1;grid-row:2}.lbls{font-size:8.5px;letter-spacing:.08em}.opts{grid-template-columns:1fr}.card{grid-template-columns:90px 1fr}.title{font-size:18px}.vics{grid-template-columns:repeat(3,1fr)}}

/* round 2: scan, don't read. Tiles = icon, one big number, two or three words. */
.head{justify-content:space-between}
.head .t{display:flex;align-items:center;gap:12px}
.mine{display:flex;align-items:center;gap:7px;font:400 18px Federo;color:var(--gold2)}
.mine i{width:34px;height:34px;border-radius:9px;background:var(--art) center 30%/150%;box-shadow:0 0 0 1.5px var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.tile{position:relative;cursor:pointer;display:grid;justify-items:center;gap:8px;padding:22px 12px 18px;border-radius:16px;border:1px solid #d8b05a40;background:#ffffff07;color:var(--ink);font:inherit;transition:transform .15s,border-color .15s,background .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--gold);background:#d8b05a14;outline:none}
.tile.best{border-color:var(--gold);background:radial-gradient(ellipse at 50% 0,#d8b05a2a,#d8b05a06 70%)}
.tile svg.ic{width:46px;height:46px}
.tile .big{font:400 34px/1 Federo;color:var(--gold2)}
.tile .big.g{color:var(--green)}.tile .big.r{color:var(--red)}
.tile .cap{font:800 12px Nunito;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tile .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:4px;font:800 12px Nunito;padding:3px 9px;border-radius:999px;background:#ffffff10;color:var(--ink)}
.tag.g{background:#4fdcaa22;color:var(--green)}.tag.r{background:#ff859022;color:var(--red)}
.tile kbd{position:absolute;top:10px;right:12px;font:800 10px Nunito;color:var(--mute);border:1px solid #ffffff22;border-radius:4px;padding:1px 5px}
.hop{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;font:400 40px Federo;color:var(--gold2)}
.hop svg{width:40px;height:24px}
.flow{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 22px}
.flow .side{text-align:center}.flow .side .big{font:400 30px/1 Federo}.flow .side small{display:block;margin-top:4px;font:800 10px Nunito;letter-spacing:.16em;color:var(--mute)}
.flow .arrow{display:flex;flex-direction:column;align-items:center;gap:3px;font:800 11px Nunito;color:var(--mute)}
.flow .arrow svg{width:70px;height:14px}
.pick{margin:22px 0 0}
.pick button{width:52px;height:52px;font-size:20px}
.vics{margin-top:22px;gap:14px}
.vic .por{width:64px;height:64px}
.go{margin-top:4px}
@media (max-width:560px){.panel{padding:26px 20px 20px}.tiles{gap:10px}.tile{padding:18px 8px 14px}.tile .big{font-size:28px}.hop{font-size:34px}}
</style></head><body>
<div class="top" id="top"></div>
<div class="stage"><div class="board"><div class="dim" id="dim"></div><section class="panel" id="panel" aria-live="polite"></section><div class="toast" id="toast"></div></div></div>
<script>
const IC={
 shield:'<svg class="ic" viewBox="0 0 48 48"><path d="M24 4 40 10v12c0 11-7 19-16 22C15 41 8 33 8 22V10z" fill="#4fdcaa22" stroke="#4fdcaa" stroke-width="2.5"/><path d="m17 24 5 5 10-11" fill="none" stroke="#4fdcaa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 fall:'<svg class="ic" viewBox="0 0 48 48"><path d="M24 6v32m-11-11 11 11 11-11" fill="none" stroke="#ff8590" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 43h28" stroke="#ff8590" stroke-width="2.5" stroke-linecap="round"/></svg>',
 ticket:'<svg class="ic" viewBox="0 0 48 48"><path d="M6 14h36v7a4 4 0 0 0 0 8v7H6v-7a4 4 0 0 0 0-8z" fill="#d8b05a22" stroke="#d8b05a" stroke-width="2.5" stroke-linejoin="round"/><path d="M30 15v18" stroke="#d8b05a" stroke-width="2" stroke-dasharray="3 3"/></svg>',
 back:'<svg class="ic" viewBox="0 0 48 48"><path d="M30 10 14 24l16 14" fill="none" stroke="#ff8590" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 pay:'<svg class="ic" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="#f0c55a" stroke="#a8770f" stroke-width="2.5"/><path d="M24 15v18M19 20h10M19 28h10" stroke="#a8770f" stroke-width="2.5" stroke-linecap="round"/></svg>',
 debt:'<svg class="ic" viewBox="0 0 48 48"><rect x="10" y="8" width="28" height="34" rx="3" fill="#ff859018" stroke="#ff8590" stroke-width="2.5"/><path d="M16 17h16M16 24h16M16 31h9" stroke="#ff8590" stroke-width="2.5" stroke-linecap="round"/></svg>',
 up:'<svg viewBox="0 0 40 24"><path d="M2 20 L36 4 M26 3 L37 4 L32 14" fill="none" stroke="#4fdcaa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 arr:'<svg viewBox="0 0 70 14"><path d="M2 7h62m-7-5 7 5-7 5" fill="none" stroke="#d8b05a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
}
const ART=c=>`--art:url(/art/countries/${c}.jpg)`
const ME={name:'Ana',c:'usa',cap:14}
const SC={
 ladder:{tab:'Ladder',kind:'FDI ladder',icon:'ladder',title:'Invest?'},
 crash:{tab:'Crash',kind:'Market crash',icon:'snake',title:'Hedge?'},
 tariff:{tab:'Tariff',kind:'Tariff',icon:'tariff',title:'Pushed back 3'},
 card:{tab:'Event card',kind:'Event card',icon:'event',title:'Banking Panic'},
 takeover:{tab:'Takeover',kind:'Hostile takeover',icon:'sanction',title:'Take a project?'},
}
let sc=location.hash.slice(1)in SC?location.hash.slice(1):'ladder',chips=2
const MAX=4,DELTA=5,FROM=37,TO=42
const head=s=>`<div class="head"><div class="t"><div class="icon"><img src="/icons/${s.icon}.svg" alt=""></div><div><div class="kind">${s.kind}</div><div class="title">${s.title}</div></div></div>
 <div class="mine"><i style="${ART(ME.c)}"></i><span class="coin"></span>${ME.cap}</div></div>`
const opt=(k,t,d,best,full)=>`<button class="opt ${best?'best':''} ${full?'full':''}" data-k="${k}" onclick="choose(this.dataset.k)"><kbd>${k}</kbd><b>${t}</b><span>${d}</span></button>`
const tile=(k,ic,big,cls,cap,tags,best)=>`<button class="tile ${best?'best':''}" data-k="${k}" onclick="choose(this.dataset.k)"><kbd>${k}</kbd>${ic}<span class="big ${cls}">${big}</span><span class="cap">${cap}</span>${tags?`<span class="tags">${tags}</span>`:''}</button>`
function body(){
 if(sc==='ladder'){const back=chips*DELTA
  return`<div class="hop"><span>${FROM}</span>${IC.up}<span>${TO}</span></div>
  <div class="pick">${Array.from({length:MAX},(_,i)=>`<button class="${i<chips?'on':''}" onclick="chips=${i+1};draw()" aria-label="${i+1} coins">${i+1}</button>`).join('')}</div>
  <div class="flow"><div class="side"><span class="big" style="color:var(--gold2)">−${chips}</span><small>NOW</small></div>
   <div class="arrow">${IC.arr}<span>${chips===1?'1 turn':chips+' turns'}</span></div>
   <div class="side"><span class="big" style="color:var(--green)">+${back}</span><small>BACK</small></div></div>
  <div class="go"><button class="btn" onclick="choose('skip')">Skip</button><button class="btn primary" onclick="choose('invest')">Invest ${chips}</button></div>`}
 if(sc==='crash')return`<div class="tiles">${tile(1,IC.shield,'−4','','Hedge',`<span class="tag">↓ 37</span><span class="tag g">projects safe</span>`,true)}
  ${tile(2,IC.fall,'↓ 26','r','Ride it',`<span class="tag r">lose +10</span>`)}</div>`
 if(sc==='tariff')return`<div class="tiles">${tile(1,IC.ticket,'24','','Use ticket',`<span class="tag g">stay</span>`,true)}
  ${tile(2,IC.back,'21','r','Go back',`<span class="tag">keep ticket</span>`)}</div>`
 if(sc==='card')return`<div class="tiles">${tile(1,IC.pay,'−2','','Pay',`<span class="tag g">no debt</span>`,true)}
  ${tile(2,IC.debt,'+1','r','Debt',`<span class="tag">keep coins</span>`)}</div>`
 if(sc==='takeover')return`<div class="vics">${[['Bo','china','+8','2'],['Lena','germany','+3','1'],['Rafi','bangladesh','+10','4']].map(([n,c,p,t],i)=>`<button class="tile vic" data-k="${i+1}" onclick="choose('${n}')"><kbd>${i+1}</kbd><div class="por" style="${ART(c)}"></div><span class="big g" style="font-size:26px">${p}</span><span class="cap">${n}</span></button>`).join('')}</div>
  <div class="flow" style="margin:16px 0 18px"><span class="tag">costs <span class="coin" style="margin:0 2px"></span> 3</span></div>
  <div class="go"><button class="btn" onclick="choose('none')">Skip</button></div>`}
function draw(){document.getElementById('panel').innerHTML=head(SC[sc])+body()}
function open(){document.getElementById('top').innerHTML=Object.entries(SC).map(([k,s])=>`<button aria-pressed="${k===sc}" onclick="sc='${k}';location.hash='${k}';open()">${s.tab}</button>`).join('')
 const p=document.getElementById('panel'),d=document.getElementById('dim');p.classList.remove('on');d.classList.remove('on');draw();setTimeout(()=>{p.classList.add('on');d.classList.add('on')},40)}
const SAID={ladder:k=>k==='skip'||!chips?'Ana skipped the ladder':`Ana invested ${chips}: +${chips*DELTA} coming`,crash:k=>k==1?'Ana hedged for 4 and kept every project':'Ana rode the crash down to 26',
 tariff:k=>k==1?'Ana used a waiver ticket':'Ana went back to 21',card:k=>k==1?'Ana paid 2 coins':'Ana took 1 debt',takeover:k=>k==='none'?'No takeover this turn':`Ana took over ${k}'s project`}
function choose(k){const p=document.getElementById('panel'),t=document.getElementById('toast');p.classList.remove('on');document.getElementById('dim').classList.remove('on')
 t.textContent=SAID[sc](k);t.classList.add('on');setTimeout(()=>{t.classList.remove('on');open()},1600)}
addEventListener('keydown',e=>{const b=document.querySelector(`#panel .opt[data-k="${e.key}"]`);if(b)b.click();if(e.key==='Enter'&&sc==='ladder')choose('invest')})
open()
</script></body></html>
