<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 5: Ticker Rows</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Step 5, round 2: four takes on the ticker-row scoreboard he liked. Same data, same "End turn" demo. */
:root{--navy:#0d1530;--navy2:#141e3d;--gold:#c9a24a;--gold2:#f5d67b;--ink:#efe6d2;--mute:#a59c88;--green:#3fd39b;--red:#ff6b78;--amber:#ffb547}
*{box-sizing:border-box}html,body{margin:0}
body{background:#1a0f08 url(wood.jpg) center/cover fixed;min-height:100vh;color:var(--ink);font:14px/1.35 system-ui}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0000 40%,#0008 100%);pointer-events:none}
.top{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 16px 0}
.top button{font:600 14px system-ui;padding:9px 14px;border-radius:999px;border:1px solid #c9a24a66;background:#0d1426cc;color:var(--ink);cursor:pointer}
.top button[aria-pressed=true]{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.top .act{background:linear-gradient(#2a2f3d,#0b0e15);border-color:#e3bd6a;color:var(--gold2)}
.note{position:relative;max-width:640px;margin:10px auto 0;text-align:center;color:#d9d2c2;background:#0b1020b3;padding:8px 14px;border-radius:10px}
.stage{position:relative;display:grid;gap:18px;padding:18px 16px 40px;max-width:1280px;margin:0 auto;grid-template-columns:minmax(0,1fr) 430px;align-items:start}
.board{aspect-ratio:1;border:5px solid #b8892e;border-radius:10px;background:#101830 url(board-bg.jpg) center/cover;box-shadow:0 18px 40px -10px #000c;position:relative;overflow:hidden}
.board::after{content:"Board";position:absolute;inset:0;display:grid;place-items:center;background:#101830d9;font:600 18px Fraunces,serif;color:#c9a24a88;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:900px){.stage{grid-template-columns:1fr}.board{max-width:520px;width:100%;justify-self:center}}
.flag{display:inline-block;width:24px;height:16px;border-radius:2px;overflow:hidden;flex:none;box-shadow:0 0 0 1px #0006}
.flag svg{display:block;width:100%;height:100%}
.float{position:absolute;font:700 18px Fraunces,serif;color:var(--green);text-shadow:0 2px 6px #000;pointer-events:none;animation:up 1.4s ease-out forwards;z-index:5}
@keyframes up{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--mute)}

/* 1. Exchange board: a trading-floor display, amber digits, change since last turn */
.X{background:#06080d;border:1px solid #2a2f3d;border-radius:10px;padding:6px 0;box-shadow:inset 0 0 0 1px #000,0 14px 30px -12px #000;font-family:'JetBrains Mono',ui-monospace,monospace}
.X .hd,.X .row{display:grid;grid-template-columns:3px 30px 52px 1fr 62px 1.3fr;gap:8px;align-items:center;padding:8px 12px 8px 0}
.X .hd{font-size:10px;color:#5d6475;letter-spacing:.1em;padding-top:4px;padding-bottom:6px;border-bottom:1px solid #1b2030}
.X .row{border-bottom:1px solid #12161f}.X .row:last-child{border-bottom:0}
.X .row.on{background:linear-gradient(90deg,#ffb54714,transparent)}
.X .st{align-self:stretch;background:var(--pc)}
.X .code{font-weight:700;color:#e9e4d6;letter-spacing:.06em}
.X .cap{font-size:22px;font-weight:700;color:var(--amber);text-shadow:0 0 10px #ffb54766;text-align:right}
.X .chg{font-size:12px;font-weight:700;text-align:right}
.X .pipe{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.X .pipe span{font-size:11px;padding:2px 6px;border-radius:4px;background:#0f2a20;color:var(--green);border:1px solid #1d5a42}
.X .pipe span.n1{background:#3fd39b;color:#05140e;border-color:#3fd39b}
.X .pipe i{font-style:normal;opacity:.7}
.X .flags{font-size:10px;color:var(--red);display:block}
.X .none{font-size:11px;color:#4a5060}

/* 2. Deco rail: navy and gold, a sparkline of the last turns, coins arriving as little stacks */
.R{background:linear-gradient(var(--navy2),var(--navy));border:1px solid #c9a24a66;border-radius:12px;padding:4px 0;box-shadow:0 14px 30px -12px #000;position:relative}
.R::before{content:"";position:absolute;inset:4px;border:1px solid #c9a24a26;border-radius:9px;pointer-events:none}
.R .row{display:grid;grid-template-columns:4px 1fr 70px 64px 118px;gap:10px;align-items:center;padding:10px 14px 10px 0;position:relative}
.R .row+.row::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#c9a24a55,transparent)}
.R .row.on{background:radial-gradient(ellipse at 30% 50%,#c9a24a1f,transparent 70%)}
.R .st{align-self:stretch;background:var(--pc);border-radius:0 3px 3px 0}
.R .who{display:flex;gap:8px;align-items:center;min-width:0}.R .who b{font:600 15px Fraunces,serif;white-space:nowrap}
.R .who small{display:block;font-size:10.5px;color:var(--mute)}
.R .tag{font:700 9.5px system-ui;color:var(--red);margin-left:4px}
.R svg.spark{width:70px;height:26px;overflow:visible}
.R .cap{font:700 26px Fraunces,serif;color:var(--gold2);text-align:right;font-variant-numeric:tabular-nums}
.R .stacks{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;align-items:end;height:34px}
.R .stacks div{display:flex;flex-direction:column-reverse;align-items:center;gap:0;position:relative;height:100%}
.R .stacks i{width:16px;height:4px;border-radius:50%;background:linear-gradient(#ffe8a0,#c9962f);box-shadow:0 1px 0 #6e4a0c;margin-top:-1px}
.R .stacks b{position:absolute;top:-2px;font:700 9.5px system-ui;color:var(--green)}
.R .stacks em{position:absolute;bottom:-12px;font:600 8.5px system-ui;color:var(--mute);font-style:normal}
.R .stacks div:first-child em{color:var(--gold2)}
.R .none{font-size:11px;color:var(--mute);text-align:center}

/* 3. Ticker tape: a scrolling tape across the top, slim rows below with only what matters now */
.T .tape{overflow:hidden;background:#05070c;border:1px solid #2a2f3d;border-radius:8px;height:34px;display:flex;align-items:center;font:700 13px 'JetBrains Mono',monospace;margin-bottom:10px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.T .tape div{display:flex;gap:28px;white-space:nowrap;animation:tape 30s linear infinite;padding-left:28px}
@keyframes tape{to{transform:translateX(-50%)}}
.T .tape span b{color:#e9e4d6;margin-right:6px}
.T .rows{display:grid;gap:6px}
.T .row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:linear-gradient(90deg,#141e3df2,#0d1530f2);border:1px solid #c9a24a33;border-left:4px solid var(--pc)}
.T .row.on{border-color:var(--gold);border-left-color:var(--pc);box-shadow:0 0 18px -6px var(--pc)}
.T .row b{font:600 14px Fraunces,serif}
.T .cap{font:700 22px Fraunces,serif;color:var(--gold2)}
.T .nx{font:700 12px system-ui;padding:3px 8px;border-radius:999px;background:#3fd39b1f;color:var(--green);border:1px solid #3fd39b55;white-space:nowrap}
.T .nx.later{background:transparent;color:var(--mute);border-color:#ffffff22}
.T .tag{font:700 10px system-ui;color:var(--red)}

/* 4. Cash-flow table: Now, then the next four turns, coins as numbers in cells; reads like a ledger */
.L{background:linear-gradient(var(--navy2),var(--navy));border:1px solid #c9a24a66;border-radius:12px;overflow:hidden;box-shadow:0 14px 30px -12px #000}
.L table{width:100%;border-collapse:collapse}
.L th{font:600 10px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:9px 6px 7px;text-align:center;border-bottom:1px solid #c9a24a44}
.L th:first-child{text-align:left;padding-left:14px}.L th.nowh{color:var(--gold2)}
.L td{padding:9px 6px;text-align:center;border-bottom:1px solid #c9a24a1a;font:700 13px system-ui;color:#4e5a7a}
.L tr:last-child td{border-bottom:0}
.L td.p{text-align:left;padding-left:10px;border-left:4px solid var(--pc)}
.L td.p div{display:flex;align-items:center;gap:8px}.L td.p b{font:600 14px Fraunces,serif;color:var(--ink)}
.L td.now{font:700 22px Fraunces,serif;color:var(--gold2);background:#c9a24a12}
.L td.in{color:var(--green)}.L td.in.big{background:#3fd39b14}
.L tr.on td{background:#c9a24a1c}.L tr.on td.now{background:#c9a24a2a}
.L .tag{font:700 9.5px system-ui;color:var(--red);display:block}
@media (max-width:420px){.L td.p b{display:none}.L td{padding:8px 3px}}
@media (max-width:420px){.X .hd,.X .row{grid-template-columns:3px 26px 40px 52px 1fr;gap:8px}.X .nm{display:none}.R .row{grid-template-columns:4px 1fr 56px 104px;gap:8px}.R svg.spark{display:none}.R .who small{display:none}}
</style></head><body>
<div class="top" id="top"></div>
<p class="note" id="note"></p>
<div class="stage"><div class="board"></div><div id="sb"></div></div>
<script>
const FLAG={
 usa:'<rect width="30" height="20" fill="#fff"/>'+[0,2,4,6,8,10,12].map(i=>`<rect y="${i*1.54}" width="30" height="1.54" fill="#b22234"/>`).join('')+'<rect width="13" height="10.8" fill="#3c3b6e"/>',
 china:'<rect width="30" height="20" fill="#de2910"/><path d="M6 3l1.2 3.6H11L8 8.8l1.1 3.6L6 10.2 2.9 12.4 4 8.8 1 6.6h3.8z" fill="#ffde00"/>',
 japan:'<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/>',
 germany:'<rect width="30" height="7" fill="#111"/><rect y="7" width="30" height="6" fill="#dd0000"/><rect y="13" width="30" height="7" fill="#ffce00"/>',
 bangladesh:'<rect width="30" height="20" fill="#006a4e"/><circle cx="13.5" cy="10" r="6" fill="#f42a41"/>',
 uk:'<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.5"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#c8102e" stroke-width="3.5"/>',
}
const PC=['#2f7de8','#e0442c','#17a673','#8e5cf0','#e0569a','#1fb5c9']
// sample mid-game state (made up for the preview); hist is capital over the last turns
const START=[
 {name:'Ana',c:'usa',code:'USA',cap:14,debt:0,st:[],pj:[{p:6,t:1},{p:4,t:3}],hist:[10,10,8,11,11,13,10,14]},
 {name:'Bo',c:'china',code:'CHN',cap:9,debt:0,st:[],pj:[{p:8,t:2}],hist:[10,12,12,14,9,11,13,9]},
 {name:'Kenji',c:'japan',code:'JPN',cap:21,debt:0,st:[],pj:[],hist:[10,11,14,15,15,18,19,21]},
 {name:'Lena',c:'germany',code:'DEU',cap:6,debt:2,st:[],pj:[{p:3,t:1},{p:3,t:2},{p:5,t:4}],hist:[10,9,9,7,12,8,6,6]},
 {name:'Rafi',c:'bangladesh',code:'BGD',cap:12,debt:0,st:[],pj:[{p:10,t:4}],hist:[10,12,13,13,16,16,18,12]},
 {name:'Will',c:'uk',code:'GBR',cap:4,debt:0,st:['Rate hike'],pj:[],hist:[10,8,9,7,7,6,5,4]},
]
let P=structuredClone(START),active=0
const OPTS={X:['1. Exchange board','A trading-floor display: amber prices, the change since last turn, and FDI arriving as chips (T+1 is next turn).'],
 R:['2. Deco rail','Navy and gold rows. A gold sparkline of the last turns, then coins arriving as small coin stacks for each of the next four turns.'],
 T:['3. Ticker tape','A scrolling tape across the top with everyone\'s price and change, and slim rows below with coins and next income only.'],
 L:['4. Cash-flow ledger','A ledger table: coins now, then what arrives in each of the next four turns. Best for planning ahead.']}
let mode=location.hash.slice(1)in OPTS?location.hash.slice(1):'X'
const flag=c=>`<span class="flag"><svg viewBox="0 0 30 20" preserveAspectRatio="none">${FLAG[c]}</svg></span>`
const sumAt=(p,k)=>p.pj.filter(x=>x.t===k).reduce((a,x)=>a+x.p,0)
const chg=p=>{const d=p.cap-p.hist.at(-2);return d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="dn">▼${-d}</span>`:`<span class="flat">–</span>`}
function spark(p,col){const h=p.hist,mx=Math.max(...h),mn=Math.min(...h),pts=h.map((v,i)=>[i/(h.length-1)*70,24-(v-mn)/Math.max(1,mx-mn)*22])
 const d='M'+pts.map(q=>q.join(',')).join(' L');return`<svg class="spark" viewBox="0 0 70 26"><path d="${d} L70,26 L0,26 Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="70" cy="${pts.at(-1)[1]}" r="2.4" fill="${col}"/></svg>`}
function render(){
 document.getElementById('top').innerHTML=Object.entries(OPTS).map(([k,[n]])=>`<button aria-pressed="${k===mode}" onclick="mode='${k}';location.hash='${k}';render()">${n}</button>`).join('')+`<button class="act" onclick="endTurn()">End turn: projects pay out</button>`
 document.getElementById('note').textContent=OPTS[mode][1]
 const sb=document.getElementById('sb');sb.className=mode
 if(mode==='X')sb.innerHTML=`<div class="hd"><span></span><span></span><span>CODE</span><span class="nm">PLAYER</span><span style="text-align:right">CAP</span><span style="text-align:right">FDI PIPELINE</span></div>`+P.map((p,i)=>`<div class="row ${i===active?'on':''}" style="--pc:${PC[i]}">
  <span class="st"></span>${flag(p.c)}<span class="code">${p.code}</span><span class="nm" style="color:#8b93a7;font-size:12px">${p.name}${p.debt?`<span class="flags">DEBT ${p.debt}</span>`:''}${p.st.map(s=>`<span class="flags" style="color:#ffc46b">${s.toUpperCase()}</span>`).join('')}</span>
  <span><span class="cap" data-cap="${i}">${p.cap}</span><span class="chg" style="display:block">${chg(p)}</span></span>
  <span class="pipe">${p.pj.length?[...p.pj].sort((a,b)=>a.t-b.t).map(x=>`<span class="${x.t===1?'n1':''}">+${x.p} <i>T+${x.t}</i></span>`).join(''):'<span class="none" style="background:none;border:0">—</span>'}</span></div>`).join('')
 if(mode==='R')sb.innerHTML=P.map((p,i)=>`<div class="row ${i===active?'on':''}" style="--pc:${PC[i]}"><span class="st"></span>
  <div class="who">${flag(p.c)}<div><b>${p.name}</b>${p.debt?`<span class="tag">DEBT ${p.debt}</span>`:''}<small>${p.code}${p.st.length?' · '+p.st.join(', '):''}</small></div></div>
  ${spark(p,PC[i])}<span class="cap" data-cap="${i}">${p.cap}</span>
  ${p.pj.length?`<div class="stacks">${[1,2,3,4].map(k=>{const v=sumAt(p,k);return`<div>${v?`<b>+${v}</b>`:''}${'<i></i>'.repeat(Math.min(7,Math.ceil(v/1.5)))}<em>${k===1?'next':'T+'+k}</em></div>`}).join('')}</div>`:'<span class="none">no projects</span>'}</div>`).join('')
 if(mode==='T')sb.innerHTML=`<div class="tape"><div>${[...P,...P].map(p=>`<span><b>${p.code}</b>${p.cap} ${chg(p)}</span>`).join('')}</div></div><div class="rows">${P.map((p,i)=>{const nx=sumAt(p,1),later=p.pj.length&&!nx
  return`<div class="row ${i===active?'on':''}" style="--pc:${PC[i]}">${flag(p.c)}<span><b>${p.name}</b> ${p.debt?`<span class="tag">DEBT ${p.debt}</span>`:''}</span><span class="cap" data-cap="${i}">${p.cap}</span>
  ${nx?`<span class="nx">+${nx} next turn</span>`:later?`<span class="nx later">+${p.pj.reduce((a,x)=>a+x.p,0)} on the way</span>`:'<span class="nx later">no projects</span>'}</div>`}).join('')}</div>`
 if(mode==='L')sb.innerHTML=`<table><thead><tr><th>Player</th><th class="nowh">Now</th><th>Next</th><th>T+2</th><th>T+3</th><th>T+4</th></tr></thead><tbody>${P.map((p,i)=>`<tr class="${i===active?'on':''}" style="--pc:${PC[i]}">
  <td class="p"><div>${flag(p.c)}<span><b>${p.name}</b>${p.debt?`<span class="tag">Debt ${p.debt}</span>`:''}</span></div></td><td class="now" data-cap="${i}">${p.cap}</td>
  ${[1,2,3,4].map(k=>{const v=sumAt(p,k);return`<td class="${v?'in':''} ${v>=6?'big':''}">${v?'+'+v:'·'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
// demo: projects move a turn closer; those due pay out with a floating +amount and a count-up
function endTurn(){const paid=[]
 P.forEach((p,i)=>{const due=sumAt(p,1);p.pj=p.pj.map(x=>({...x,t:x.t-1})).filter(x=>x.t>0);if(due)paid.push([i,p.cap,due]);p.cap+=due;p.hist=[...p.hist.slice(1),p.cap]})
 active=(active+1)%P.length;render()
 paid.forEach(([i,from,due])=>{const el=document.querySelector(`[data-cap="${i}"]`);if(!el)return;el.textContent=from
  const f=document.createElement('span');f.className='float';f.textContent='+'+due;const r=el.getBoundingClientRect();f.style.left=r.right+scrollX+4+'px';f.style.top=r.top+scrollY-6+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1500)
  const t0=performance.now(),tick=t=>{const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(from+due*k);if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)})
 if(P.every(p=>!p.pj.length))setTimeout(()=>{P=structuredClone(START);render()},1800)}
render()
</script></body></html>
